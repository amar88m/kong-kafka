
  Yes — here’s a deployable Spring Boot Kafka producer + consumer setup for GCP.
  
  For an always-on Kafka consumer, GKE is usually the safest default. Google Cloud now also supports Cloud Run worker pools for continuous, non-HTTP background workloads, and specifically documents Kafka consumer autoscaling there. Google also offers Managed Service for Apache Kafka if you want a managed cluster instead of self-hosting Kafka.
  
  What this sample does
  • POST /api/prompts publishes a prompt to Kafka
  • a Kafka consumer reads model responses from another topic
  • both are container-ready for GCP
• deploy target: GKE
  • can also be adapted for Cloud Run worker pools for the consumer side
