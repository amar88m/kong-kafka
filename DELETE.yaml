  4) Producer config
  
  KafkaProducerConfig.java
  package com.example.kafkasvc.config;
  
  import com.example.kafkasvc.model.PromptEvent;
  import org.apache.kafka.clients.producer.ProducerConfig;
  import org.apache.kafka.common.serialization.StringSerializer;
  import org.springframework.beans.factory.annotation.Value;
  import org.springframework.context.annotation.Bean;
  import org.springframework.context.annotation.Configuration;
  import org.springframework.kafka.core.DefaultKafkaProducerFactory;
  import org.springframework.kafka.core.KafkaTemplate;
  import org.springframework.kafka.core.ProducerFactory;
  import org.springframework.kafka.support.serializer.JsonSerializer;
  
  import java.util.HashMap;
  import java.util.Map;
  
  @Configuration
  public class KafkaProducerConfig {
  
  @Value("${spring.kafka.bootstrap-servers}")
  private String bootstrapServers;
  
  @Bean
  public ProducerFactory<String, PromptEvent> producerFactory() {
  Map<String, Object> config = new HashMap<>();
  config.put(ProducerConfig.BOOTSTRAP_SERVERS_CONFIG, bootstrapServers);
  config.put(ProducerConfig.KEY_SERIALIZER_CLASS_CONFIG, StringSerializer.class);
  config.put(ProducerConfig.VALUE_SERIALIZER_CLASS_CONFIG, JsonSerializer.class);
  config.put(ProducerConfig.ACKS_CONFIG, "all");
  config.put(ProducerConfig.ENABLE_IDEMPOTENCE_CONFIG, true);
  return new DefaultKafkaProducerFactory<>(config);
  }
  
  @Bean
  public KafkaTemplate<String, PromptEvent> kafkaTemplate() {
  return new KafkaTemplate<>(producerFactory());
  }
}
  5) Consumer config
  
  KafkaConsumerConfig.java
  
  package com.example.kafkasvc.config;
  
  import com.example.kafkasvc.model.LlmResponseEvent;
  import org.apache.kafka.clients.consumer.ConsumerConfig;
  import org.apache.kafka.common.serialization.StringDeserializer;
  import org.springframework.beans.factory.annotation.Value;
  import org.springframework.context.annotation.Bean;
  import org.springframework.context.annotation.Configuration;
  import org.springframework.kafka.annotation.EnableKafka;
  import org.springframework.kafka.config.ConcurrentKafkaListenerContainerFactory;
  import org.springframework.kafka.core.ConsumerFactory;
  import org.springframework.kafka.core.DefaultKafkaConsumerFactory;
  import org.springframework.kafka.support.serializer.JsonDeserializer;
  
  import java.util.HashMap;
  import java.util.Map;
  
  @EnableKafka
  @Configuration
  public class KafkaConsumerConfig {
  
  @Value("${spring.kafka.bootstrap-servers}")
  private String bootstrapServers;
  
  @Value("${app.kafka.consumer-group}")
  private String consumerGroup;
  
  @Bean
  public ConsumerFactory<String, LlmResponseEvent> consumerFactory() {
  JsonDeserializer<LlmResponseEvent> deserializer =
  new JsonDeserializer<>(LlmResponseEvent.class);
  deserializer.addTrustedPackages("*");
  
  Map<String, Object> config = new HashMap<>();
  config.put(ConsumerConfig.BOOTSTRAP_SERVERS_CONFIG, bootstrapServers);
  config.put(ConsumerConfig.GROUP_ID_CONFIG, consumerGroup);
  config.put(ConsumerConfig.KEY_DESERIALIZER_CLASS_CONFIG, StringDeserializer.class);
  config.put(ConsumerConfig.VALUE_DESERIALIZER_CLASS_CONFIG, deserializer.getClass());
  config.put(ConsumerConfig.AUTO_OFFSET_RESET_CONFIG, "earliest");
  config.put(ConsumerConfig.ENABLE_AUTO_COMMIT_CONFIG, false);
  
  return new DefaultKafkaConsumerFactory<>(
  config,
  new StringDeserializer(),
  deserializer
  );
  }
  
  @Bean
  public ConcurrentKafkaListenerContainerFactory<String, LlmResponseEvent>
  kafkaListenerContainerFactory() {
  ConcurrentKafkaListenerContainerFactory<String, LlmResponseEvent> factory =
  new ConcurrentKafkaListenerContainerFactory<>();
  factory.setConsumerFactory(consumerFactory());
  factory.getContainerProperties().setAckMode(
  org.springframework.kafka.listener.ContainerProperties.AckMode.MANUAL
  );
  return factory;
  }
}
  6) Producer service
  
  PromptProducerService.java
  package com.example.kafkasvc.service;
  
  import com.example.kafkasvc.model.PromptEvent;
  import org.slf4j.Logger;
  import org.slf4j.LoggerFactory;
  import org.springframework.beans.factory.annotation.Value;
  import org.springframework.kafka.core.KafkaTemplate;
  import org.springframework.stereotype.Service;
  
  @Service
  public class PromptProducerService {
  
  private static final Logger log = LoggerFactory.getLogger(PromptProducerService.class);
  
  private final KafkaTemplate<String, PromptEvent> kafkaTemplate;
  
  @Value("${app.kafka.prompt-topic}")
  private String promptTopic;
  
  public PromptProducerService(KafkaTemplate<String, PromptEvent> kafkaTemplate) {
  this.kafkaTemplate = kafkaTemplate;
  }
  
  public void publishPrompt(PromptEvent event) {
  kafkaTemplate.send(promptTopic, event.getRequestId(), event)
  .whenComplete((result, ex) -> {
  if (ex != null) {
  log.error("Failed to publish prompt for requestId={}", event.getRequestId(), ex);
  } else {
  log.info("Published prompt requestId={} topic={} partition={} offset={}",
  event.getRequestId(),
  result.getRecordMetadata().topic(),
  result.getRecordMetadata().partition(),
  result.getRecordMetadata().offset());
  }
  });
  }
}
  7) Consumer service
  
  LlmResponseConsumer.java
  package com.example.kafkasvc.service;
  
  import com.example.kafkasvc.model.LlmResponseEvent;
  import org.slf4j.Logger;
  import org.slf4j.LoggerFactory;
  import org.springframework.kafka.annotation.KafkaListener;
  import org.springframework.kafka.support.Acknowledgment;
  import org.springframework.stereotype.Service;
  
  @Service
  public class LlmResponseConsumer {
  
  private static final Logger log = LoggerFactory.getLogger(LlmResponseConsumer.class);
  
  @KafkaListener(
  topics = "${app.kafka.response-topic}",
  containerFactory = "kafkaListenerContainerFactory"
  )
  public void consume(LlmResponseEvent event, Acknowledgment acknowledgment) {
  try {
  log.info("Consumed response requestId={} model={} status={}",
  event.getRequestId(),
  event.getModelName(),
  event.getStatus());

// TODO:
  // 1. Save response to DB
  // 2. Aggregate by requestId
  // 3. Send grouped responses to Pegasus
  // 4. Update request status
  
  acknowledgment.acknowledge();
} catch (Exception e) {
  log.error("Error while processing requestId={}", event.getRequestId(), e);
  throw e;
}
}
}
  8) REST controller for publishing prompts
  
  PromptController.java
  package com.example.kafkasvc.controller;
  
  import com.example.kafkasvc.model.PromptEvent;
  import com.example.kafkasvc.service.PromptProducerService;
  import jakarta.validation.Valid;
  import org.springframework.http.ResponseEntity;
  import org.springframework.web.bind.annotation.*;
  
  @RestController
  @RequestMapping("/api/prompts")
  public class PromptController {
  
  private final PromptProducerService producerService;
  
  public PromptController(PromptProducerService producerService) {
  this.producerService = producerService;
}

  @PostMapping
  public ResponseEntity<PromptEvent> publish(@Valid @RequestBody PromptEvent event) {
  producerService.publishPrompt(event);
  return ResponseEntity.ok(event);
}

  @GetMapping("/health")
  public ResponseEntity<String> health() {
  return ResponseEntity.ok("OK");
}
}
