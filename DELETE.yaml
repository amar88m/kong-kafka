  11) Kubernetes deployment for GKE
  
k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-service
  template:
    metadata:
      labels:
        app: kafka-service
    spec:
      containers:
        - name: kafka-service
          image: REGION-docker.pkg.dev/PROJECT_ID/my-repo/kafka-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: BOOTSTRAP_SERVERS
              value: "YOUR_KAFKA_BOOTSTRAP:9092"
            - name: PROMPT_TOPIC
              value: "prompt_requests"
            - name: RESPONSE_TOPIC
              value: "llm_raw_responses"
            - name: CONSUMER_GROUP
              value: "kafka-service-group"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
spec:
  selector:
    app: kafka-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer



  12) Build and deploy on GCP
  
  Build image
  gcloud auth configure-docker REGION-docker.pkg.dev
  
  docker build -t REGION-docker.pkg.dev/PROJECT_ID/my-repo/kafka-service:latest .
  docker push REGION-docker.pkg.dev/PROJECT_ID/my-repo/kafka-service:latest
  Deploy to GKE
  gcloud container clusters get-credentials YOUR_CLUSTER --region YOUR_REGION --project PROJECT_ID
  
  kubectl apply -f k8s/deployment.yaml
  Google’s GKE docs cover standard container deployment patterns, and Cloud Deploy also supports GKE targets if you want a release pipeline later.
