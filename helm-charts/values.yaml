# Default values for sample-app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: europe-docker.pkg.dev/ssv-rtl-devops-registry-624/docker-release/cmap/port3/svc-account-balance-service:<+pipeline.stages.Container_Image_Build.spec.execution.steps.Additional_Registry_Push.spec.envVariables.IMAGE_TAG>
  pullPolicy: Always

imagePullSecrets: []
nameOverride: "svc-account-balance-service"
fullnameOverride: "svc-account-balance-service"

istioNetworking: # Enable/Disable Istio components
  enabled: true

serviceAccount:
  create: true
  svc: pre-gsa-gke-account-balan3c983
  projectId: wrk-pre-wrk01-svp-63d0c6
  automountServiceAccountToken: false

podAnnotations: {}
podLabels:
  codeclassification: confidential
  engineeringlead: 'Garry.Todd'
  lastreviewdate: 05Oct2025
  IBS_service: false
  environment: pre-prod
  cost_center: 455122
  cmdb_appid: al27117
  application: PORT

# traffic.sidecar.istio.io/excludeOutboundIPRanges: 10.178.0.0/16

podSecurityContext:
  fsGroup: 1
  runAsNonRoot: true
  runAsUser: 10002
  seccompProfile:
    type: RuntimeDefault
  supplementalGroups:
    - 1337

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 10002
  runAsGroup: 10002
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 8080

container:
  port: 8080

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Additional volumes on the output Deployment definition.
volumes:
  - emptyDir: {}
    name: tmp
  - configMap:
      defaultMode: 420
      items:
        - key: va.hcl
          path: va.hcl
      name: svc-account-balance-service-cm-vault
    name: config
  - emptyDir: {}
    name: shared-data
  - name: hcv-root
    secret:
      secretName: ca-bundle-istio-rev #TODO

## Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - mountPath: /tmp
    name: tmp
  - mountPath: /etc/vault
    name: config
  - mountPath: /vault
    name: shared-data
  - name: hcv-root
    mountPath: /etc/cabundle/vault

probes:
  startupProbe:
    tcpSocket:
      port: 8080
    periodSeconds: 2
    successThreshold: 1
    failureThreshold: 90
    timeoutSeconds: 5
  livenessProbe:
    tcpSocket:
      port: 8080
    periodSeconds: 30
    successThreshold: 1
    failureThreshold: 3
    timeoutSeconds: 1
  readinessProbe:
    tcpSocket:
      port: 8080
    periodSeconds: 30
      successThreshold: 1
      failureThreshold: 3
      timeoutSeconds: 1

tolerations:
  key: "user-int"

nodeSelector:
  node_pool: "ew2-msv-pre-caas01-svp01-knp01-int"

affinity: {}

virtualservice:
  gateway: caas-web-lbgcp-int-ingressgateway
  hosts: web201-int-ew2.c2.test.lbgcp.cloud
  prefix: /int/cmap/port3/accountbalanceserviced1/balance-enquiry #TODO

authorizationPolicy:
  methods:
    - GET
    - PUT
    - POST

safetronics:
  enabled: true
  port: 443
  cidr:
    - 10.172.189.146/32

kafka:
  enabled: true
  port: 9092
  cidr:
    - 10.85.127.64/27
    - 10.85.110.128/26

kafkaschema:
  enabled: true
  port: 443
  cidr:
    - 10.85.127.64/27
    - 10.85.110.128/26

redis:
  enabled: true
  port: 6378
  cidr:
    - 10.178.37.160/28

